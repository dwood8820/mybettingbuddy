name: NBA builder test
on:
  push:
    branches: [nbadev]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.2.3 pyarrow
      - run: python scripts/build_nba.py --out pout --cache "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/nbadev-out/nba_lines.json"
      - run: |
          cd pout && git init -q -b nbadev-out && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm test && git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" nbadev-out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
