name: Refresh data

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # "Run workflow" button for an on-demand refresh
  push:                       # rebuild right away when a data builder changes
    branches: [main]
    paths: ["scripts/build_data.py", "scripts/build_ncaaf.py", "scripts/build_nba.py", "scripts/build_ncaab.py", ".github/workflows/refresh-data.yml"]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.2.3 pyarrow==17.0.0
      - name: Build NFL data files
        run: python scripts/build_data.py --out out
      - name: Build NCAAF data files
        run: python scripts/build_ncaaf.py --out out --cache "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/ncaaf_lines.json"
      - name: Build NBA data files
        run: python scripts/build_nba.py --out out --cache "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/nba_lines.json"
      - name: Build NCAAB data files
        run: python scripts/build_ncaab.py --out out --max-new 40000 --cache "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/ncaab_lines.json"
      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "mybettingbuddy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
