name: NCAAB builder test
on:
  push:
    branches: [ncaabdev]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas==2.2.3 pyarrow==17.0.0
      - run: python scripts/build_ncaab.py --out pout --max-new 40000 --cache "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ncaabdev-out/ncaab_lines.json"
      - run: |
          cd pout && git init -q -b ncaabdev-out && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm test && git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ncaabdev-out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
